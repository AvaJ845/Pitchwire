name = "pitchwire-ai"
main = "src/worker.js"
compatibility_date = "2026-08-01"
preview_urls = false   # only the one workers.dev route; no extra public surface

# Secrets (never in this file — set with `wrangler secret put`):
#   OPENROUTER_API_KEY     openrouter.ai key (sk-or-v1-…) — many :free models incl. GLM; not CF-blocked
#   NVIDIA_API_KEY         NVIDIA build.nvidia.com key (free; only the gpt-oss models are serverless-free)
#   ZAI_API_KEY            z.ai API key (Aliyun-fronted → blocked from Cloudflare; kept for a non-CF host)
#   PITCHWIRE_CLIENT_TOKEN a long random string the app sends as `Authorization: Bearer <...>` (rotatable; NOT a provider key)

[vars]
RATE_LIMIT_PER_MIN = "20"

[observability]
enabled = true
