name: Pitchwire
options:
  bundleIdPrefix: com.avaresearch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Xcode 16+/26 rejects the legacy "traditional headermap" behaviour that
    # ALWAYS_SEARCH_USER_PATHS=YES implies. This project has no bridging headers
    # or user header search paths, so turn it off explicitly.
    ALWAYS_SEARCH_USER_PATHS: NO
    # AvaResearch LLC team — same as the other com.avaresearch.* apps
    # (Milestone, CapitolSketch). Automatic signing: the simulator ignores it,
    # a physical device resolves a provisioning profile against this team.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3L683975L8
  configs:
    debug:
      ENABLE_TESTABILITY: YES   # @testable import Pitchwire from the unit tests
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG   # xcodegen doesn't add this like Xcode's template does
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
      ONLY_ACTIVE_ARCH: YES
targets:
  Pitchwire:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Config
        buildPhase: resources
        optional: true
      - path: Resources
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: Pitchwire
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.pitchwire
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Pitchwire
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  PitchwireUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_NAME: PitchwireUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.pitchwireUITests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Pitchwire
  PitchwireUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
    settings:
      base:
        PRODUCT_NAME: PitchwireUnitTests
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.pitchwireUnitTests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pitchwire.app/Pitchwire"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Pitchwire
schemes:
  Pitchwire:
    build:
      targets:
        Pitchwire: all
        PitchwireUITests: [test]
        PitchwireUnitTests: [test]
    test:
      targets:
        - PitchwireUnitTests
        - PitchwireUITests
