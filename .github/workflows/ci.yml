name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests
            testing: BeatMatchUnitTests
          - name: UI tests
            testing: BeatMatchUITests

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: BeatMatch
        run: xcodegen generate

      - name: Boot an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          rts = json.load(sys.stdin)['devices']
          for rt in sorted(rts, reverse=True):
              if 'iOS' not in rt:
                  continue
              for dev in rts[rt]:
                  if dev.get('isAvailable') and 'iPhone' in dev['name']:
                      print(dev['udid']); sys.exit(0)
          sys.exit('no iPhone simulator available')")
          echo "Booting simulator $UDID"
          xcrun simctl bootstatus "$UDID" -b   # boots if needed, waits until fully up
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: ${{ matrix.name }}
        working-directory: BeatMatch
        run: |
          run_tests() {
            set +e
            xcodebuild test \
              -scheme BeatMatch \
              -only-testing:${{ matrix.testing }} \
              -destination "id=${{ steps.sim.outputs.udid }}" \
              -resultBundlePath TestResults.xcresult \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee xcb.log
            local rc=${PIPESTATUS[0]}
            set -e
            return $rc
          }

          echo "::group::xcodebuild test (attempt 1)"; run_tests; rc=$?; echo "::endgroup::"
          [ $rc -eq 0 ] && exit 0

          # Simulator-attach flakes ("failed to bless service hub") are common on
          # CI — if it looks like one, reset the simulator and retry once.
          if grep -q "failed to bless service hub\|Unable to boot\|Timed out waiting" xcb.log; then
            echo "simulator flake detected — resetting and retrying"
            rm -rf TestResults.xcresult
            xcrun simctl shutdown all || true
            xcrun simctl erase "${{ steps.sim.outputs.udid }}" || true
            xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b || true
            echo "::group::xcodebuild test (attempt 2)"; run_tests; rc=$?; echo "::endgroup::"
            [ $rc -eq 0 ] && exit 0
          fi
          exit 1

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.testing }}
          path: BeatMatch/TestResults.xcresult
          retention-days: 5
